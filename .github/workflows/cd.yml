name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image when Dockerfile exists
        shell: bash
        run: |
          if [[ -f Dockerfile ]]; then
            docker build -t bidmart-core-be:${{ github.event.workflow_run.head_sha }} .
          else
            echo "::warning::No Dockerfile found. Skipping Docker build."
          fi

      - name: Trigger staging deployment webhook
        shell: bash
        env:
          DEPLOY_WEBHOOK: ${{ secrets.STAGING_DEPLOY_WEBHOOK }}
        run: |
          if [[ -z "${DEPLOY_WEBHOOK}" ]]; then
            echo "::error::Missing STAGING_DEPLOY_WEBHOOK secret."
            exit 1
          fi

          payload="$(printf '{"service":"bidmart-core-be","environment":"staging","sha":"%s"}' "${{ github.event.workflow_run.head_sha }}")"
          curl --fail --show-error --silent \
            -X POST "${DEPLOY_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${payload}"

  deploy-production:
    name: Deploy to Production
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build Docker image when Dockerfile exists
        shell: bash
        run: |
          if [[ -f Dockerfile ]]; then
            docker build -t bidmart-core-be:${{ github.event.workflow_run.head_sha }} .
          else
            echo "::warning::No Dockerfile found. Skipping Docker build."
          fi

      - name: Trigger production deployment webhook
        shell: bash
        env:
          DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
        run: |
          if [[ -z "${DEPLOY_WEBHOOK}" ]]; then
            echo "::error::Missing PRODUCTION_DEPLOY_WEBHOOK secret."
            exit 1
          fi

          payload="$(printf '{"service":"bidmart-core-be","environment":"production","sha":"%s"}' "${{ github.event.workflow_run.head_sha }}")"
          curl --fail --show-error --silent \
            -X POST "${DEPLOY_WEBHOOK}" \
            -H "Content-Type: application/json" \
            -d "${payload}"
