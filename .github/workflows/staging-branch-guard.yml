name: Staging Branch Guard

on:
  pull_request_target:
    branches:
      - staging

permissions:
  contents: read

jobs:
  staging-branch-guard:
    name: Allow only ci-cd into staging
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch for staging
        shell: bash
        run: |
          if [[ "${{ github.head_ref }}" != "ci-cd" ]]; then
            echo "::error::Only PRs from 'ci-cd' can target 'staging'."
            echo "::error::Current source branch: '${{ github.head_ref }}'."
            exit 1
          fi
