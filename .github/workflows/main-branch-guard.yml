name: Main Branch Guard

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

jobs:
  main-branch-guard:
    name: Allow only staging into main
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch for main
        shell: bash
        run: |
          if [[ "${{ github.head_ref }}" != "staging" ]]; then
            echo "::error::Only PRs from 'staging' can target 'main'."
            echo "::error::Current source branch: '${{ github.head_ref }}'."
            exit 1
          fi
