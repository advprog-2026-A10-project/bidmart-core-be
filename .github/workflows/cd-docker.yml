name: cd-docker

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      CONTAINER_NAME: bidmart-core-be
      CONTAINER_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build image (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: local-scan:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local-scan:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-ec2:
    needs: docker-build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
      CONTAINER_NAME: bidmart-core-be
      HOST_PORT: 80
      CONTAINER_PORT: 8080
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - name: Check deploy prerequisites
        id: deploy_gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${EC2_HOST:-}" && -n "${EC2_USER:-}" && -n "${EC2_SSH_KEY:-}" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "EC2 secrets are not fully configured. Skipping deployment step."
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 via SSH
        if: steps.deploy_gate.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          envs: IMAGE,CONTAINER_NAME,HOST_PORT,CONTAINER_PORT
          script: |
            set -euo pipefail
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${IMAGE}"
            if docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              docker rm -f "${CONTAINER_NAME}"
            fi
            docker run -d --restart unless-stopped \
              --name "${CONTAINER_NAME}" \
              -p "${HOST_PORT}:${CONTAINER_PORT}" \
              "${IMAGE}"
