name: CI

on:
  pull_request:
    branches:
      - staging
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - ci-cd
      - staging
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_COVERAGE: "80"

jobs:
  pr-policy:
    name: PR Policy Gates
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch flow policy
        shell: bash
        run: |
          base_ref="${{ github.event.pull_request.base.ref }}"
          head_ref="${{ github.event.pull_request.head.ref }}"

          if [[ "${base_ref}" == "staging" && "${head_ref}" != "ci-cd" ]]; then
            echo "::error::Only pull requests from 'ci-cd' can target 'staging'."
            echo "::error::Current source branch: '${head_ref}'."
            exit 1
          fi

          if [[ "${base_ref}" == "main" && "${head_ref}" != "staging" ]]; then
            echo "::error::Only pull requests from 'staging' can target 'main'."
            echo "::error::Current source branch: '${head_ref}'."
            exit 1
          fi

  rust-ci:
    name: Rust CI Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Cargo manifest
        id: manifest
        shell: bash
        run: |
          manifest_path="$(find . -name Cargo.toml -not -path './target/*' -not -path './.git/*' | sort | head -n 1)"
          if [[ -z "${manifest_path}" ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Cargo.toml found in this branch. Rust gates are skipped."
            exit 0
          fi

          manifest_path="${manifest_path#./}"
          manifest_dir="$(dirname "${manifest_path}")"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${manifest_path}" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=${manifest_dir}" >> "$GITHUB_OUTPUT"

      - name: Detect lockfile mode
        id: cargo_config
        if: ${{ steps.manifest.outputs.found == 'true' }}
        shell: bash
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: |
          if [[ -f Cargo.lock ]]; then
            echo "locked_flag=--locked" >> "$GITHUB_OUTPUT"
          else
            echo "locked_flag=" >> "$GITHUB_OUTPUT"
            echo "::warning::Cargo.lock not found, running cargo commands without --locked."
          fi

      - name: Setup stable Rust
        if: ${{ steps.manifest.outputs.found == 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo registry and target
        if: ${{ steps.manifest.outputs.found == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true

      - name: Install cargo-llvm-cov
        if: ${{ steps.manifest.outputs.found == 'true' }}
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check build graph
        if: ${{ steps.manifest.outputs.found == 'true' }}
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: cargo check --workspace --all-targets --all-features ${{ steps.cargo_config.outputs.locked_flag }}

      - name: Rustfmt check
        if: ${{ steps.manifest.outputs.found == 'true' }}
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        if: ${{ steps.manifest.outputs.found == 'true' }}
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Unit and integration tests
        if: ${{ steps.manifest.outputs.found == 'true' }}
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: cargo test --workspace --all-targets --all-features ${{ steps.cargo_config.outputs.locked_flag }}

      - name: Coverage gate (>= 80%)
        if: ${{ steps.manifest.outputs.found == 'true' }}
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov \
            --workspace \
            --all-features \
            --summary-only \
            --fail-under-lines "${MIN_COVERAGE}" \
            --ignore-filename-regex "main.rs"

      - name: Release build
        if: ${{ steps.manifest.outputs.found == 'true' }}
        working-directory: ${{ steps.manifest.outputs.manifest_dir }}
        run: cargo build --workspace --all-features --release ${{ steps.cargo_config.outputs.locked_flag }}

      - name: Report skipped Rust checks
        if: ${{ steps.manifest.outputs.found != 'true' }}
        run: echo "Rust gates skipped because no Cargo.toml exists in this branch."
